name: Validate apps.json

on:
  pull_request:
    paths:
      - apps.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install AJV CLI
        run: npm install -g ajv-cli

      - name: Validate schema
        run: ajv validate -s schema.json -d apps.json --strict=false

      - name: Check for duplicate URLs
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const urls = JSON.parse(fs.readFileSync("apps.json", "utf8"));
          const dupes = urls.filter((url, i) => urls.indexOf(url) !== i);
          if (dupes.length) {
            console.error("Duplicate URLs found:\n" + [...new Set(dupes)].join("\n"));
            process.exit(1);
          }
          console.log(`✓ ${urls.length} app(s), no duplicates`);
          EOF
